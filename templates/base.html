<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/favicon.png">
<title>{% block title %}拾光集{% endblock %}</title>
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
{% block content %}{% endblock %}
{% block tabbar %}
<nav class="tabbar">
  <a href="/" class="titem {% if active_tab == 'index' %}on{% endif %}"><span class="tic">🏠</span>浏览</a>
  <a href="/queue" class="titem {% if active_tab == 'queue' %}on{% endif %}"><span class="tic">📥</span>队列</a>
  <a href="/stats" class="titem {% if active_tab == 'stats' %}on{% endif %}"><span class="tic">📊</span>统计</a>
  <a href="/?mode=manage" class="titem {% if active_tab == 'manage' %}on{% endif %}"><span class="tic">🗑️</span>管理</a>
</nav>
{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
