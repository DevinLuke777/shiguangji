services:
  shiguangji:
    build: .
    container_name: shiguangji
    restart: always
    ports:
      - "8090:8090"
    volumes:
      - ./shiguangji-data:/data          # SQLite 数据库持久化（自动创建）
      - /path/to/your/media:/media:ro    # ⚠️ 改成你的媒体目录（平台/日期/标题 结构）
    environment:
      - MEDIA_ROOT=/media
      - DB_PATH=/data/media_library.db
      - ITEMS_PER_PAGE=40
      - LOG_LEVEL=INFO

# ⚠️ 注意：不要把空的宿主目录挂到 /app 覆盖代码
#    镜像已 COPY 全部代码；数据库请走 /data（见上），媒体目录挂 /media
#    如需启用队列 worker（粘贴链接自动入库），在宿主机跑 download_worker.py
